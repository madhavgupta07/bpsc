  <script>
    // Apply persisted preferences before paint to avoid flash of wrong theme/language.
    try {
      var t = localStorage.getItem('stet.theme');
      if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
      document.documentElement.lang = localStorage.getItem('stet.lang') || 'en';
    } catch (e) { }
  </script>
